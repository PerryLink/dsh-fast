packages:
  - .

nodeLinker: hoisted
onlyBuiltDependencies:
  - esbuild
# The `@deepseek-ai/*` family may sit inside the registry's
# minimum-release-age window; exclude the whole scope so installs resolve.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
allowBuilds:
  esbuild: true
verifyDepsBeforeRun: false
# Keep ONE @deepseek-ai/dsh-typert-protocol in the tree, on the same line as the
# rest of the graph. A transitive copy from another line would land next to this
# repo's own copy, and both ship a `typert` declaration on the same interface,
# which the published-line ruler (skipLibCheck: false) rejects with TS2717. This
# repo's whole graph is the 0.1.7-alpha.2 line (see AGENTS.md), so the override
# pins that line for everyone.
#
# @deepseek-ai/dsh-session-query is a peer-only seam (this repo never imports it,
# so it has no devDependency to pin it) and pnpm auto-installs peers, so its
# resolved version lives in the lockfile alone. The widened peer range still
# admitted the 0.1.6-alpha.2 resolution that was already there, which kept a whole
# 0.1.6-alpha.2 subgraph — and its second schemastery copy — in the tree while
# everything else moved to 0.1.7-alpha.2. The override pins the line for it too.
overrides:
  '@deepseek-ai/dsh-typert-protocol': 0.1.7-alpha.2
  '@deepseek-ai/dsh-session-query': 0.1.7-alpha.2
