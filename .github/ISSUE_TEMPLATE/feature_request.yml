name: Feature request
description: Suggest an idea for dsh-fast
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to dsh-fast.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem are you trying to solve? What is missing or painful today?
      placeholder: I need dsh-fast to ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What would you like dsh-fast to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have tried or considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, related discussions.
