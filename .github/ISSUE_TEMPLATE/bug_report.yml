name: Bug report
description: Report a bug or unexpected behavior in dsh-fast
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. The more detail you provide, the faster we can help.

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The `dsh-fast` version (e.g. from `dsh plugin list` or `npm ls dsh-fast`).
      placeholder: e.g. 0.1.3
    validations:
      required: true

  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      description: The harness (`dsh`) version you are running.
      placeholder: e.g. 0.1.5-alpha.1
    validations:
      required: true

  - type: input
    id: os-node
    attributes:
      label: OS and Node version
      description: The operating system and Node.js version.
      placeholder: e.g. macOS 14, Node 22.19.0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant logs, reports, or command output.

        **⚠️ Redact before pasting — remove tokens, API keys, secrets, Authorization/request headers, and personal identifiers.**
      render: text
      placeholder: Paste logs here (after redacting anything sensitive)
