<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-fast pipeline: the append-time event channel folds counters for request/header, assistant/message, compaction and tool/result; the setInterval sampling channel reads the optional tokenMeter, systemPrompt and sessionQuery services; both merge into one five-section snapshot (load, spill, compaction, context, cache), which the timer persists into the dsh_fast storage domain and the on-demand report builds into /fast text and fast_report JSON; /fast --history reads the domain back">
<title>dsh-fast: two channels, one snapshot, three surfaces</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#f9f6fd"/><stop offset="1" stop-color="#e4eaf8"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#2a2350" flood-opacity="0.1"/></filter>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B67B4"/></marker>
<marker id="arr-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a90a4"/></marker>
</defs>
