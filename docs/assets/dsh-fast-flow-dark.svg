<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="dsh-fast flow: session events to collector to snapshot to /fast and fast_report">
<title>dsh-fast flow</title>
<rect width="1200" height="400" rx="18" fill="#0d1117"/>
<text x="60" y="62" fill="#f0f6fc" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700">dsh-fast</text>
<text x="60" y="94" fill="#8b949e" font-family="ui-monospace,monospace" font-size="16">read-only session diagnostics · off the model path</text>
<line x1="60" y1="116" x2="1140" y2="116" stroke="#30363d"/>
<rect x="60" y="150" width="240" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="180" y="192" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700">session/event</text>
<text x="180" y="222" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">O(1) fold</text>
<path d="M306 200h28" stroke="#8b949e" stroke-width="3"/>
<path d="M332 193l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="340" y="150" width="240" height="100" rx="14" fill="#161b22" stroke="#4B67B4" stroke-width="2"/>
<text x="460" y="192" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700">collector</text>
<text x="460" y="222" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">load · spill · compaction</text>
<path d="M586 200h28" stroke="#8b949e" stroke-width="3"/>
<path d="M612 193l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="620" y="150" width="240" height="100" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<text x="740" y="192" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700">snapshot()</text>
<text x="740" y="222" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">timer · context · cache</text>
<path d="M866 200h28" stroke="#8b949e" stroke-width="3"/>
<path d="M892 193l10 7-10 7" fill="none" stroke="#8b949e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="900" y="150" width="240" height="100" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
<text x="1020" y="192" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="17" font-weight="700">/fast · fast_report</text>
<text x="1020" y="222" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12">human · model</text>
<rect x="60" y="292" width="1080" height="46" rx="10" fill="#21262d" stroke="#30363d"/>
<text x="600" y="321" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13">dsh_fast storage domain · bounded per-session history</text>
<text x="60" y="378" fill="#8b949e" font-family="ui-monospace,monospace" font-size="13">read-only · no network · model path untouched</text>
</svg>
